<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same mark as src/components/Logo.jsx (navbar/admin-topbar logo) —
       colors hardcoded here since a standalone favicon file can't read
       this app's CSS custom properties (var(--accent)). Background circle
       matches the navbar's own dark background (Navbar.css #1a1a1a) that
       the real logo sits on, so the tab icon isn't just floating on
       whatever color the browser chrome happens to be. -->
  <circle cx="32" cy="32" r="32" fill="#1a1a1a" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ff6b00" stroke-width="2.5" />
