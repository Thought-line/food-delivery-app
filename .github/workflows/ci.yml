   name: CI Check

   on:
     push:
       branches: [main]
     pull_request:
       branches: [main]

   jobs:
     check:
       runs-on: ubuntu-latest
       steps:
         - name: Get the code
           uses: actions/checkout@v4

         - name: List files
           run: ls -la

         - name: Check README exists
           run: test -f README.md && echo "README found ✅"
